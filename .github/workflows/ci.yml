name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: estudos
          POSTGRES_PASSWORD: estudos
          POSTGRES_DB: estudos
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - run: pytest -q -rs

     
  front:                                                     # nome do job (aparece na aba Actions)
    name: Front (React + TypeScript)                         # nome legível na tela da execução
    runs-on: ubuntu-latest                                   # máquina Linux limpa, como nos outros jobs
    defaults:
      run:
        working-directory: front                             # todo "run" deste job roda dentro de front
    steps:
      - uses: actions/checkout@v4                            # baixa o código do repositório

      - uses: actions/setup-node@v4                          # instala o Node
        with:
          node-version: 24                                   # mesma versão do job typescript
          cache: npm                                         # guarda os pacotes do npm entre execuções
          cache-dependency-path: front/package-lock.json     # o lock do FRONT (não o da raiz)

      - run: npm ci                                          # instala as versões exatas do package-lock.json do front
      - run: npm test                                        # roda os testes das funções do notas.ts
      - run: npx tsc                                         # confere os tipos (App.tsx, notas.ts, vite.config.ts)
