# Postgres Subir: docker compose up -d   
# Parar e apagar: docker compose down
# Parar: docker compose stop
# Porta 5433 , para não colidir com outro Postgres que já use a 5432.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: estudos
      POSTGRES_PASSWORD: estudos
      POSTGRES_DB: estudos
    ports:
      - "5433:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
  api:
    build:
      context: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://estudos:estudos@db:5432/estudos
      OLLAMA_URL: http://host.docker.internal:11434
    ports:
      - "8000:8000"
    depends_on:
      - db
